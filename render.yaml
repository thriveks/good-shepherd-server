services:
  - type: web
    name: good-shepherd-server
    runtime: node
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: good-shepherd-db
          property: connectionString

databases:
  - name: good-shepherd-db
    plan: basic-256mb
