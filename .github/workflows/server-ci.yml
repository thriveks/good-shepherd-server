name: Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: good_shepherd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d good_shepherd_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/good_shepherd_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run migrate

      - name: Run server tests
        run: npm run test:refactor

      - name: Validate runtime configuration
        env:
          NODE_ENV: test
          MQTT_BRIDGE_ENABLED: "false"
        run: npm run config:check

      - name: Security audit
        run: npm audit --omit=dev

      - name: Whitespace safety
        run: |
          git diff --check
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
